<!doctype html>
<html lang="de" class="h-full bg-[#FAF9F6]">
  <head>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('goodies_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (saved === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        try {
          var g = typeof globalThis !== 'undefined' ? globalThis : (typeof window !== 'undefined' ? window : this);
          if (g) {
            var activeFetch = g.fetch;
            var safeFetch = function() {
              var target = activeFetch || (window && window.fetch);
              return target ? target.apply(this, arguments) : Promise.reject(new Error('Fetch unavailable'));
            };

            try {
              Object.defineProperty(g, 'fetch', {
                get: function() {
                  return activeFetch || safeFetch;
                },
                set: function(newFetch) {
                  activeFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              if (typeof Window !== 'undefined' && Window.prototype) {
                try {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() {
                      return activeFetch || safeFetch;
                    },
                    set: function(newFetch) {
                      activeFetch = newFetch;
                    },
                    configurable: true,
                    enumerable: true
                  });
                } catch (e2) {}
              }
            }
          }
        } catch (err) {}
      })();
    </script>
